name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    name: Backend (unit, integration, architecture, contract)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Verify (Testcontainers uses the runner's Docker)
        run: ./backend/mvnw -B -f backend/pom.xml verify

  frontend:
    name: Frontend (lint, typecheck, unit, contract types)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm --prefix frontend ci
      - run: npm --prefix frontend run lint
      - run: npm --prefix frontend run typecheck
      - run: npm --prefix frontend test
      - run: npm --prefix frontend run api:types -- --check

  secrets:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: gitleaks detect
        run: |
          docker run --rm -v "$PWD:/repo" zricethezav/gitleaks:v8.30.1 detect --source /repo --no-banner --redact

  dependency-audit:
    name: Dependency audit (osv-scanner, npm audit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - name: osv-scanner (fails at CVSS >= 7.0; exceptions only in backend/osv-scanner.toml)
        run: |
          curl -sSfL -o osv-scanner https://github.com/google/osv-scanner/releases/download/v2.6.0/osv-scanner_linux_amd64
          chmod +x osv-scanner
          ./osv-scanner scan source --config backend/osv-scanner.toml \
            --lockfile backend/pom.xml --lockfile frontend/package-lock.json \
            --format json --output osv-results.json || true
          node -e '
            const r = require("./osv-results.json");
            const high = [];
            for (const res of r.results ?? []) for (const pkg of res.packages ?? [])
              for (const g of pkg.groups ?? []) {
                const score = parseFloat(g.max_severity ?? "0");
                if (score >= 7.0) high.push(`${pkg.package.name}@${pkg.package.version}: ${g.ids.join(", ")} (CVSS ${score})`);
              }
            if (high.length) { console.error("High/critical vulnerabilities:\n" + high.join("\n")); process.exit(1); }
            console.log("No vulnerabilities with CVSS >= 7.0");
          '
      - run: npm --prefix frontend audit --audit-level=high

  observability:
    name: Observability (promtool, dashboards)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - name: promtool check config / rules / test rules
        run: |
          # same image version as in compose.yaml
          PROM="docker run --rm -v $PWD/observability/prometheus:/etc/prometheus --entrypoint promtool prom/prometheus:v3.13.3"
          $PROM check config /etc/prometheus/prometheus.yml
          $PROM check rules /etc/prometheus/rules/shop.yml
          $PROM test rules /etc/prometheus/tests/shop.test.yml
      - name: Dashboards and rules refer only to contract metrics
        run: node scripts/check-dashboards.mjs

  e2e:
    name: E2E (Playwright + Stripe test mode)
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    env:
      STRIPE_SECRET_KEY: ${{ secrets.STRIPE_TEST_SECRET_KEY }}
      DB_PASSWORD: E2e-Passw0rd!
      DB_URL: jdbc:sqlserver://localhost:1433;databaseName=shop;encrypt=true;trustServerCertificate=true
      DB_USER: sa
      APP_BASE_URL: http://localhost:5173
      GRAFANA_ADMIN_PASSWORD: e2e-not-used-${{ github.run_id }}
    steps:
      - name: Skip when Stripe test secrets are missing (e.g. PRs from forks)
        id: guard
        run: |
          if [ -z "$STRIPE_SECRET_KEY" ]; then
            echo "STRIPE_TEST_* secrets not set - skipping E2E."
            echo "run=false" >> "$GITHUB_OUTPUT"
          else
            echo "run=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@v5
        if: steps.guard.outputs.run == 'true'
      - uses: actions/setup-java@v5
        if: steps.guard.outputs.run == 'true'
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - uses: actions/setup-node@v5
        if: steps.guard.outputs.run == 'true'
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Start SQL Server
        if: steps.guard.outputs.run == 'true'
        # --wait treats the one-off sqlserver-init container as failed once it exits, so it runs separately
        run: |
          docker compose up -d --wait sqlserver
          docker compose run --rm sqlserver-init
      - name: Stripe CLI - forward webhooks and capture the signing secret
        if: steps.guard.outputs.run == 'true'
        run: |
          docker run -d --name stripe-cli --network host -e STRIPE_API_KEY="$STRIPE_SECRET_KEY" \
            stripe/stripe-cli:v1.51.1 listen --forward-to http://localhost:8080/api/payments/stripe/webhook \
            --events checkout.session.completed,checkout.session.async_payment_succeeded,checkout.session.async_payment_failed,checkout.session.expired,payment_intent.payment_failed
          WHSEC=$(docker run --rm -e STRIPE_API_KEY="$STRIPE_SECRET_KEY" stripe/stripe-cli:v1.51.1 listen --print-secret)
          echo "::add-mask::$WHSEC"
          echo "STRIPE_WEBHOOK_SECRET=$WHSEC" >> "$GITHUB_ENV"
      - name: Start backend (e2e profile)
        if: steps.guard.outputs.run == 'true'
        run: |
          ./backend/mvnw -B -q -f backend/pom.xml -DskipTests package
          nohup java -jar backend/target/shop-0.1.0-SNAPSHOT.jar --spring.profiles.active=e2e > backend.log 2>&1 &
          for i in $(seq 1 60); do curl -sf localhost:8081/actuator/health/readiness && break; sleep 2; done
      - name: Run E2E
        if: steps.guard.outputs.run == 'true'
        run: |
          npm --prefix frontend ci
          npx --prefix frontend playwright install --with-deps chromium
          npm --prefix frontend run e2e
      - uses: actions/upload-artifact@v4
        if: failure() && steps.guard.outputs.run == 'true'
        with:
          name: e2e-report
          path: |
            frontend/playwright-report
            backend.log
