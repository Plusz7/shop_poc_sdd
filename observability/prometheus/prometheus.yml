# Local Prometheus for the shop (research R-31). The backend runs on the host; its metrics are on the
# management port 8081, never on the API port 8080 (contracts/metrics.md §1).
global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/rules/*.yml

scrape_configs:
  - job_name: shop-backend
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["host.docker.internal:8081"]
