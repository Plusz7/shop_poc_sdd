# promtool unit tests of the alert rules (SC-011): every rule has a "firing" case (after `for` elapses)
# and a "resolved" case (the condition no longer holds). Run:
#   docker run --rm -v "$PWD/observability/prometheus:/etc/prometheus" --entrypoint promtool \
#     prom/prometheus:v3.13.3 test rules /etc/prometheus/tests/shop.test.yml
rule_files:
  - ../rules/shop.yml

evaluation_interval: 15s

tests:
  - name: HighServerErrorRate
    interval: 1m
    input_series:
      - series: 'http_server_requests_seconds_count{application="shop",uri="/api/cart",status="500"}'
        values: '0+10x10 100+0x30'
      - series: 'http_server_requests_seconds_count{application="shop",uri="/api/cart",status="200"}'
        values: '0+100x40'
    alert_rule_test:
      - eval_time: 10m
        alertname: HighServerErrorRate
        exp_alerts:
          - exp_labels:
              application: shop
              severity: critical
            exp_annotations:
              summary: More than 5% of API responses are server errors (5xx).
              dashboard: http://localhost:3000/d/shop-http/shop-http?viewPanel=2
      - eval_time: 30m
        alertname: HighServerErrorRate
        exp_alerts: []

  - name: SlowCatalogOrCartResponses
    interval: 1m
    input_series:
      # 10 requests/min between 1 s and 2 s for 10 minutes, then 10 requests/min below 0.5 s
      - series: 'http_server_requests_seconds_bucket{application="shop",uri="/api/products",le="0.5"}'
        values: '0x10 0+10x30'
      - series: 'http_server_requests_seconds_bucket{application="shop",uri="/api/products",le="1.0"}'
        values: '0x10 0+10x30'
      - series: 'http_server_requests_seconds_bucket{application="shop",uri="/api/products",le="2.0"}'
        values: '0+10x40'
      - series: 'http_server_requests_seconds_bucket{application="shop",uri="/api/products",le="+Inf"}'
        values: '0+10x40'
    alert_rule_test:
      - eval_time: 10m
        alertname: SlowCatalogOrCartResponses
        exp_alerts:
          - exp_labels:
              application: shop
              severity: warning
              uri: /api/products
            exp_annotations:
              summary: 95th percentile of catalog or cart response time is above 1 s (SC-003).
              dashboard: http://localhost:3000/d/shop-http/shop-http?viewPanel=3
      - eval_time: 30m
        alertname: SlowCatalogOrCartResponses
        exp_alerts: []

  - name: ForgedPaymentConfirmation
    interval: 1m
    input_series:
      - series: 'shop_payment_webhook_total{application="shop",outcome="rejected_signature"}'
        values: '0x5 1+0x30'
    alert_rule_test:
      - eval_time: 7m
        alertname: ForgedPaymentConfirmation
        exp_alerts:
          - exp_labels:
              application: shop
              severity: critical
              outcome: rejected_signature
            exp_annotations:
              summary: A payment confirmation with an invalid signature was received.
              dashboard: http://localhost:3000/d/shop-payments-integrations/shop-payments-and-integrations?viewPanel=4
      - eval_time: 20m
        alertname: ForgedPaymentConfirmation
        exp_alerts: []

  - name: PaymentProviderErrors
    interval: 1m
    input_series:
      - series: 'shop_stripe_calls_seconds_count{application="shop",operation="create_session",outcome="error"}'
        values: '0+5x10 50+0x30'
      - series: 'shop_stripe_calls_seconds_count{application="shop",operation="create_session",outcome="success"}'
        values: '0+5x40'
    alert_rule_test:
      - eval_time: 10m
        alertname: PaymentProviderErrors
        exp_alerts:
          - exp_labels:
              application: shop
              severity: critical
            exp_annotations:
              summary: More than 20% of Stripe calls end with an error or a timeout.
              dashboard: http://localhost:3000/d/shop-payments-integrations/shop-payments-and-integrations?viewPanel=1
      - eval_time: 30m
        alertname: PaymentProviderErrors
        exp_alerts: []

  - name: DelayedPaymentConfirmations
    interval: 1m
    input_series:
      # confirmations between 30 s and 60 s for 10 minutes, then below 30 s
      - series: 'shop_payment_confirmation_delay_seconds_bucket{application="shop",le="30.0"}'
        values: '0x10 0+10x30'
      - series: 'shop_payment_confirmation_delay_seconds_bucket{application="shop",le="60.0"}'
        values: '0+10x40'
      - series: 'shop_payment_confirmation_delay_seconds_bucket{application="shop",le="+Inf"}'
        values: '0+10x40'
    alert_rule_test:
      - eval_time: 10m
        alertname: DelayedPaymentConfirmations
        exp_alerts:
          - exp_labels:
              application: shop
              severity: critical
            exp_annotations:
              summary: 95th percentile of payment confirmation delay is above 30 s (SC-007).
              dashboard: http://localhost:3000/d/shop-payments-integrations/shop-payments-and-integrations?viewPanel=5
      - eval_time: 30m
        alertname: DelayedPaymentConfirmations
        exp_alerts: []

  - name: MissingPaymentConfirmations
    interval: 1m
    input_series:
      - series: 'shop_orders_placed_total{application="shop"}'
        values: '0+1x40'
      # no webhooks for 20 minutes, then they arrive again
      - series: 'shop_payment_webhook_total{application="shop",outcome="processed"}'
        values: '0x20 0+1x20'
      - series: 'shop_payment_webhook_total{application="shop",outcome="duplicate"}'
        values: '0x40'
    alert_rule_test:
      - eval_time: 10m
        alertname: MissingPaymentConfirmations
        exp_alerts:
          - exp_labels:
              application: shop
              severity: critical
            exp_annotations:
              summary: Orders are placed but no payment confirmations arrive (check stripe-cli and the webhook secret).
              dashboard: http://localhost:3000/d/shop-payments-integrations/shop-payments-and-integrations?viewPanel=4
      - eval_time: 30m
        alertname: MissingPaymentConfirmations
        exp_alerts: []

  - name: OrderNeedsReview
    interval: 1m
    input_series:
      - series: 'shop_orders_completed_total{application="shop",status="NEEDS_REVIEW"}'
        values: '0x5 1+0x40'
    alert_rule_test:
      - eval_time: 7m
        alertname: OrderNeedsReview
        exp_alerts:
          - exp_labels:
              application: shop
              severity: warning
              status: NEEDS_REVIEW
            exp_annotations:
              summary: An order needs manual review.
              dashboard: http://localhost:3000/d/shop-purchase-funnel/shop-purchase-funnel?viewPanel=2
      - eval_time: 25m
        alertname: OrderNeedsReview
        exp_alerts: []

  - name: OutboxBacklog
    interval: 1m
    input_series:
      - series: 'shop_outbox_oldest_seconds{application="shop"}'
        values: '0x5 400x5 0x20'
    alert_rule_test:
      - eval_time: 7m
        alertname: OutboxBacklog
        exp_alerts:
          - exp_labels:
              application: shop
              severity: warning
              requires: fulfillment
            exp_annotations:
              summary: The oldest unsent outbox event is older than 5 minutes.
              description: Expected in this feature - no job dispatches outbox events until the fulfillment feature (R-30).
              dashboard: http://localhost:3000/d/shop-payments-integrations/shop-payments-and-integrations?viewPanel=7
      - eval_time: 15m
        alertname: OutboxBacklog
        exp_alerts: []

  - name: ShopDown
    interval: 1m
    input_series:
      - series: 'up{job="shop-backend",instance="host.docker.internal:8081"}'
        values: '1x5 0x5 1x20'
    alert_rule_test:
      - eval_time: 8m
        alertname: ShopDown
        exp_alerts:
          - exp_labels:
              application: shop
              severity: critical
              job: shop-backend
              instance: host.docker.internal:8081
            exp_annotations:
              summary: Prometheus cannot scrape the shop backend metrics.
              dashboard: http://localhost:3000/d/shop-jvm-database/shop-jvm-and-database?viewPanel=8
      - eval_time: 15m
        alertname: ShopDown
        exp_alerts: []
