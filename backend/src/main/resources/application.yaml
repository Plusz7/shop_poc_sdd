# Values of secrets come ONLY from environment variables (Constitution, Principle I; research R-20).
spring:
  application:
    name: shop
  datasource:
    url: ${DB_URL}
    username: ${DB_USER}
    password: ${DB_PASSWORD}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    locations: classpath:db/migration
  messages:
    basename: i18n/messages
    fallback-to-system-locale: false
  jackson:
    deserialization:
      # "quantity": 1.5 must be a validation error, not silently truncated to 1
      accept-float-as-int: false

shop:
  stripe:
    # Empty default on purpose: an unresolved placeholder would be bound as the literal "${...}"
    # and fail the format check instead of reporting the missing variable (R-20).
    secret-key: ${STRIPE_SECRET_KEY:}
    webhook-secret: ${STRIPE_WEBHOOK_SECRET:}
    connect-timeout: 5s
    read-timeout: 10s
    api-base: ${STRIPE_API_BASE:https://api.stripe.com}
  app:
    base-url: ${APP_BASE_URL}

springdoc:
  api-docs:
    enabled: true
  swagger-ui:
    enabled: false

management:
  server:
    port: 8081
  endpoints:
    web:
      exposure:
        include: health,prometheus
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never
  metrics:
    tags:
      application: ${spring.application.name}
    distribution:
      percentiles-histogram:
        http.server.requests: true
      slo:
        http.server.requests: 100ms,300ms,500ms,1s,2s

logging:
  pattern:
    level: "%5p [%X{requestId:-}]"
